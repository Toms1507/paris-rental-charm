# Met à jour chaque mois les données du simulateur de revenus (relevés Inside Airbnb).
# Le commit n'est créé que si les données ont changé et que le site compile toujours.
name: Mise à jour des données du simulateur

on:
  schedule:
    - cron: "0 6 22 * *" # le 22 de chaque mois, Inside Airbnb publiant vers le milieu du mois
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recalculer les données de marché
        run: python3 scripts/build-market-data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier que le site compile avec les nouvelles données
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p .

      - name: Enregistrer les nouvelles données
        run: |
          if git diff --quiet -- src/content/market-paris.ts; then
            echo "Données inchangées."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/market-paris.ts
          git commit -m "Mise à jour mensuelle des données du simulateur"
          git push
