# Prospection des agences immobilières (scripts/prospection.mjs) : liste, rédaction des messages,
# envoi des messages validés dans /gestion/prospection, relances et détection des réponses.
# Secrets du dépôt : SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY, SMTP_PASSWORD.
# Sans SUPABASE_SERVICE_ROLE_KEY la tâche ne fait rien ; sans SMTP_PASSWORD elle n'envoie rien.
name: Prospection des agences

# Lancée uniquement par l'horloge Supabase (pg_cron, fonction spinelle_dispatch) : 3 passages
# complets et 5 passages d'envoi par jour, plus la surveillance (relance si aucun passage depuis
# 3 h). Les horloges GitHub faisaient doublon et consommaient les minutes de calcul du compte.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "complet (tout), envoi (envois et réponses seulement) ou test (connexion à la boîte, rien n'est envoyé)"
        default: complet
      verify:
        description: "test seulement : adresses à vérifier, séparées par des virgules"
        default: ""
      sample:
        description: "test seulement : adresse qui reçoit un exemplaire d'un vrai message"
        default: ""

concurrency:
  group: prospection
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prospection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          VERIFY_TEST: ${{ inputs.verify }}
          SAMPLE_TO: ${{ inputs.sample }}
          PROSPECT_MODE: ${{ github.event.schedule == '47 6-16 * * 1-6' && 'envoi' || inputs.mode || 'complet' }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Secrets Supabase absents : prospection non activée."
            exit 0
          fi
          npm install --no-audit --no-fund --no-save @anthropic-ai/sdk @supabase/supabase-js nodemailer imapflow mailparser playwright
          # Navigateur pour les formulaires de contact (à chaque passage).
          # Une panne d'installation (serveurs Ubuntu injoignables) ne doit jamais bloquer les e-mails :
          # un nouvel essai, puis le passage continue sans formulaires.
          # Navigateur seulement pour les passages complets (formulaires) : économise les minutes.
          if [ "$PROSPECT_MODE" = "complet" ]; then
            npx playwright install --with-deps chromium \
              || (sleep 30 && npx playwright install --with-deps chromium) \
              || npx playwright install chromium \
              || echo "Navigateur non installé : passage sans formulaires de contact."
          fi
          node scripts/prospection.mjs
