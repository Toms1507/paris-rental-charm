# Logiciel de gestion : synchronise les calendriers, planifie les ménages, envoie les messages
# voyageurs et, le 1er du mois, les rapports propriétaires, même quand le logiciel est fermé.
# Nécessite le secret de dépôt PMS_CRON_SECRET (même valeur que la variable Vercel du même nom).
name: Automatisations du logiciel de gestion

# Lancée chaque heure par l'horloge Supabase (spinelle-gestion) ; plus d'horloge GitHub, qui
# consommait les minutes de calcul du compte.
on:
  workflow_dispatch:
    inputs:
      redeposer_depuis:
        description: "Déposer à nouveau dans la boîte les demandes notifiées depuis cette date (AAAA-MM-JJ)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Demandes du site (audit, simulateur, partenaires) déposées dans la boîte de réception de
      # contact@ (IMAP, e-mail en secours) : aucune demande ne doit rester invisible. Dans le même travail pour ne compter
      # qu'une minute de calcul par heure.
      - name: Envoyer les nouvelles demandes par e-mail
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          REDEPOSER_DEPUIS: ${{ inputs.redeposer_depuis }}
        run: |
          npm install --no-audit --no-fund --no-save @supabase/supabase-js nodemailer imapflow
          node scripts/demandes-site.mjs
      - name: Lancer les automatisations
        env:
          PMS_CRON_SECRET: ${{ secrets.PMS_CRON_SECRET }}
        run: |
          if [ -z "$PMS_CRON_SECRET" ]; then
            echo "Secret PMS_CRON_SECRET absent : automatisations serveur non activées."
            exit 0
          fi
          # Domaine principal, sinon l'adresse Vercel du même site (si le domaine est indisponible).
          for base in https://spinelleconciergerie.fr https://paris-rental-charm.vercel.app; do
            if curl -sS --fail-with-body -X POST "$base/api/pms/cron" \
              -H "Authorization: Bearer $PMS_CRON_SECRET" --max-time 280; then exit 0; fi
            echo "Échec sur $base, essai suivant."
          done
          exit 1
