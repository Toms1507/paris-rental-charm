# Suppression des données fictives de démonstration du logiciel de gestion (scripts/nettoyage-demo.mjs).
# Lancement manuel uniquement ; « simulation » liste ce qui serait supprimé sans rien effacer.
name: Nettoyage démo

on:
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation seulement (1) ou suppression réelle (0)"
        required: true
        default: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nettoyage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.simulation }}
        run: |
          npm install --no-audit --no-fund --no-save @supabase/supabase-js
          node scripts/nettoyage-demo.mjs
